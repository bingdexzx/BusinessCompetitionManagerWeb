[project]
name = "bcm-plugin-sdk"
version = "1.1.0"
description = "比赛包插件开发类型提示（ctx 方法/参数说明、INPUT_SCHEMA 键补全、manifest JSON Schema）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bcm_plugin_sdk*"]

[tool.setuptools.package-data]
bcm_plugin_sdk = ["py.typed", "schemas/*.json"]
