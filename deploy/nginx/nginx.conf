# ============================================================================
# 独立可用的 nginx 主配置（生产单机示例）
# ----------------------------------------------------------------------------
# 位置：/etc/nginx/nginx.conf（Linux）或 nginx 安装目录/conf/nginx.conf（Windows）
# 站点配置放在 conf.d/bcm.conf（本目录的 bcm.conf，路径/域名按需修改）
# ============================================================================

user  www-data;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志：去 query（避免 WS ?token= 进日志）
    log_format bcm_main '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status '
                        '$body_bytes_sent "$http_referer" "$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log bcm_main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens   off;                    # 不暴露 nginx 版本

    # 请求体上限（与 .env 的 UPLOAD_MAX_BYTES 对齐）
    client_max_body_size 100m;
    client_body_buffer_size 128k;

    # gzip：文本类资源压缩（前端 JS/CSS、JSON）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml+rss application/atom+xml image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
