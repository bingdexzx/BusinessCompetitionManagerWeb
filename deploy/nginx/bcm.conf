# ============================================================================
# 商赛辅助办赛系统 —— Nginx 站点配置
# ----------------------------------------------------------------------------
# 拓扑：
#   nginx :80/:443
#     ├─ /            → 前端构建产物（BusinessCompetitionManagerWebFrontend/dist，SPA）
#     ├─ /api/        → waitress 127.0.0.1:8000（HTTP API）
#     └─ /ws/         → daphne  127.0.0.1:8001（WebSocket，需 Upgrade）
#
# 使用前把下面 3 个路径/域名换成你的：
#   server_name bcm.example.com;   # 纯 IP 部署填服务器 IP，或改成 _
#   root        /srv/bcm/frontend/dist;
#   （可选）证书路径；纯 IP 部署不要启用 HTTPS 段
# ============================================================================

upstream bcm_http {
    server 127.0.0.1:8000;
    keepalive 32;               # 复用后端连接，减少 TIME_WAIT
}

upstream bcm_ws {
    server 127.0.0.1:8001;
}

# WebSocket 升级头
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name bcm.example.com;

    # 如果证书已就绪，取消下面一行强制 HTTPS
    # return 301 https://$host$request_uri;

    # 访问日志继承 http 段（本目录 nginx.conf 的 bcm_main 已去掉 query；
    # 若用发行版默认 nginx.conf，/ws 的 access_log off 仍能防止 token 入日志）
    error_log /var/log/nginx/bcm.error.log warn;

    # 上传/比赛包上限：与 .env 的 UPLOAD_MAX_BYTES / PACKAGE_MAX_BYTES 对齐（默认 100MB）
    client_max_body_size 100m;
    client_body_timeout 120s;

    # 安全响应头（应用层也有一份，双保险）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # ------------------------------------------------------------------ 前端
    root /srv/bcm/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;          # SPA 路由回退
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ------------------------------------------------------------------ API
    location /api/ {
        proxy_pass http://bcm_http;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 大文件上传不落 nginx 临时盘（直接转发给后端）
        proxy_request_buffering off;
    }

    # ------------------------------------------------------------- WebSocket
    location /ws/ {
        proxy_pass http://bcm_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;                  # 长连接
        proxy_send_timeout 3600s;

        # token 在 query 上：不记录访问日志（上面 log_format 已去 query，这里再保险）
        access_log off;
    }
}

# ============================================================================
# HTTPS（证书就绪后启用；推荐 certbot 自动签发）
