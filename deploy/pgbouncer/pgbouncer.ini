; PgBouncer 配置（transaction pooling）—— 400 人规模建议接入
; 数据库名通配：全局库 + 动态比赛库 comp_<id> 都走同一个 bouncer
[databases]
* = host=127.0.0.1 port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; 认证：与 PostgreSQL 一致（SCRAM），userlist.txt 里放 SCRAM 哈希
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; 关键：事务级池化（Django 兼容性最好；不要用 session 模式，连接会一直被占）
pool_mode = transaction

; 客户端上限 ≈ 并发用户数；服务端池按 CPU/IO 调
max_client_conn = 600
default_pool_size = 30
min_pool_size = 5
reserve_pool_size = 10
reserve_pool_timeout = 3

; 服务端连接空闲回收 + 排队超时（超时让请求快速失败，避免雪崩）
server_idle_timeout = 60
query_wait_timeout = 15

; Django/psycopg2 启动参数
ignore_startup_parameters = extra_float_digits
application_name_add_host = 1

; 日志（排查慢查询与池等待）
log_connections = 0
log_disconnections = 0
stats_period = 60
